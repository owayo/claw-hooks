name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Rust の版は mise.toml を正とする。Cargo.toml の rust-version も同じ値
  # (tests/toolchain_sync.rs で検証) なので、このジョブが MSRV の検証を兼ねる。
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # mise 本体の版は mise.toml に書けないため `version` で固定し、action も
      # コミット SHA で固定する。版を上げるときは release.yml も同時に書き換える。
      # cache は使わない。toolchain の実体は rustup 管理 (~/.rustup) でキャッシュに
      # 入らず、復元すると clippy / rustfmt が欠けたまま進む (jdx/mise-action#215)。
      - name: Install Rust toolchain (mise.toml)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.4
          cache: false

      # runner に元から入っている stable ではなく、mise.toml の版が選ばれていることを確かめる。
      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo clippy --version
          cargo fmt --version
          test "$(rustc --version | cut -d' ' -f2)" = "$(mise current rust)"

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('mise.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --locked --all-features --verbose

      # フォールバック(非 AST)パーサー経路も検証する。ast-parser を無効化した
      # ビルドは独立した文字列パーサーを使うため、AST 経路のテストでは
      # 検出漏れ(fail-open)を取りこぼし得る。両構成を CI で必ず通す。
      - name: Run tests (no default features / fallback parser)
        run: cargo test --locked --no-default-features --verbose

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run clippy (no default features)
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check

  build:
    name: Build
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (mise.toml)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.4
          cache: false

      - name: Verify Rust toolchain
        shell: bash
        run: |
          rustc --version
          test "$(rustc --version | cut -d' ' -f2)" = "$(mise current rust)"

      # target は mise.toml に書かない (書くと全開発者・全ジョブが全 target を
      # 入れることになる)。ビルドするジョブで mise.toml の toolchain に追加する。
      - name: Add build target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
