[package]
name = "claw-hooks"
version = "26.7.101"
edition = "2024"
rust-version = "1.85"
authors = ["owayo <yoheiowa@gmail.com>"]
description = "AI coding agent hook system for Claude Code, Cursor, Windsurf, Antigravity CLI, and Codex CLI"
license = "MIT"
repository = "https://github.com/owayo/claw-hooks"
keywords = ["cli", "hooks", "ai", "claude-code", "cursor"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# time 0.3.45 の RUSTSEC-2026-0009 を避ける。修正版は Rust 1.88 以上を要求するため、
# MSRV 1.85 でローカル時刻を扱える chrono と同期 writer を使用する。
chrono = "0.4.45"
logroller = "0.1.12"
dirs = "6.0.0"
regex = "1.13.0"
thiserror = "2.0.18"
anyhow = "1.0.103"

[dependencies.tree-sitter]
version = "0.26.10"
optional = true

[dependencies.tree-sitter-bash]
version = "0.25.1"
optional = true

[features]
default = ["ast-parser"]
ast-parser = ["tree-sitter", "tree-sitter-bash"]

# Unix では timeout 時にプロセスグループ全体を SIGKILL するため libc を使う。
# Windows では同等の Job Object 実装は未対応のため、libc 依存は不要。
[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
# 開発時のコンパイルを速くする
opt-level = 0
debug = true
