[package]
name = "claw-hooks"
version = "26.9.100"
edition = "2024"
# mise.toml で固定した toolchain と同じ値にする (tests/toolchain_sync.rs で検証)。
# CI はこの版だけでビルド・テストするので、それより古い版への対応は宣言しない。
rust-version = "1.98.1"
authors = ["owayo <yoheiowa@gmail.com>"]
description = "AI coding agent hook system for Claude Code, Cursor, Windsurf, Antigravity CLI, Codex CLI, and Grok CLI"
license = "MIT"
repository = "https://github.com/owayo/claw-hooks"
keywords = ["cli", "hooks", "ai", "claude-code", "cursor"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
chrono = "0.4.45"
logroller = "0.1.12"
dirs = "7.0.0"
regex = "1.13.1"
thiserror = "2.0.20"
anyhow = "1.0.104"

[dependencies.tree-sitter]
version = "0.27.0"
optional = true

[dependencies.tree-sitter-bash]
version = "0.25.1"
optional = true

[features]
default = ["ast-parser"]
ast-parser = ["tree-sitter", "tree-sitter-bash"]

# Unix では timeout 時にプロセスグループ全体を SIGKILL するため libc を使う。
# Windows では同等の Job Object 実装は未対応のため、libc 依存は不要。
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
# 開発時のコンパイルを速くする
opt-level = 0
debug = true
