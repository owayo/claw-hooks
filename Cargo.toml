[package]
name = "claw-hooks"
version = "26.9.100"
edition = "2024"
rust-version = "1.85"
authors = ["owayo <yoheiowa@gmail.com>"]
description = "AI coding agent hook system for Claude Code, Cursor, Windsurf, Antigravity CLI, Codex CLI, and Grok CLI"
license = "MIT"
repository = "https://github.com/owayo/claw-hooks"
keywords = ["cli", "hooks", "ai", "claude-code", "cursor"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# time 0.3.45 の RUSTSEC-2026-0009 を避ける。修正版は Rust 1.88 以上を要求するため、
# MSRV 1.85 でローカル時刻を扱える chrono と同期 writer を使用する。
chrono = "0.4.45"
logroller = "0.1.12"
dirs = "7.0.0"
regex = "1.13.1"
thiserror = "2.0.20"
anyhow = "1.0.104"

# tree-sitter 0.27 系とその依存 tree-sitter-language 0.1.8 は rustc 1.90 以上を要求し、
# MSRV 1.85 (CI の msrv ジョブで検証) を満たせないため 0.26 系に固定する。
# MSRV を引き上げる判断をするまで、依存更新ツールでこの上限を超えないこと。
[dependencies.tree-sitter]
version = "~0.26.13"
optional = true

# tree-sitter-bash が推移的に引く tree-sitter-language も 0.1.8 から rustc 1.90 を要求する。
# Cargo.lock 側で 0.1.7 に固定してあるので、依存更新時は MSRV チェックを必ず通すこと。
[dependencies.tree-sitter-bash]
version = "0.25.1"
optional = true

[features]
default = ["ast-parser"]
ast-parser = ["tree-sitter", "tree-sitter-bash"]

# Unix では timeout 時にプロセスグループ全体を SIGKILL するため libc を使う。
# Windows では同等の Job Object 実装は未対応のため、libc 依存は不要。
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
# 開発時のコンパイルを速くする
opt-level = 0
debug = true
